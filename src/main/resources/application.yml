server:
  port: 5700
  tomcat:
    # The cancel is PUT .../ServiceRequest?identifier=system|42. Tomcat refuses a raw | (and these)
    # in a query by default; the relay percent-encodes them when it forwards.
    relaxed-query-chars: '|,{,},[,],^,<,>,",`,\'

spring:
  application:
    name: integrationhub
  datasource:
    url: ${HUB_DB_URL:jdbc:postgresql://localhost:5433/integrationhub}
    username: ${HUB_DB_USER:integrationhub}
    password: ${HUB_DB_PASSWORD:integrationhub}
  flyway:
    enabled: true
  rabbitmq:
    host: ${HUB_RABBITMQ_HOST:localhost}
    port: ${HUB_RABBITMQ_PORT:5672}
    username: ${HUB_RABBITMQ_USER:guest}
    password: ${HUB_RABBITMQ_PASSWORD:guest}
    connection-timeout: 5s
    publisher-confirm-type: correlated

management:
  health:
    # The relay works with the broker down (events wait in the outbox), so its state is a metric
    # (hub.events.outbox.*), not a reason for the health check to fail.
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    git:
      mode: simple
    build:
      enabled: true

hub:
  events:
    # De-identified events to RabbitMQ (docs/events.md). Off until a secret is set.
    enabled: ${HUB_EVENTS_ENABLED:false}
    pseudonym-secret: ${HUB_EVENTS_PSEUDONYM_SECRET:}
    mrn-system: urn:clinichub:{clinic}:mrn
    exchange: clinical.events
    queue: analytics.clinical-events
  hl7:
    # HL7 v2 (docs/architecture.md, phase 4): ORU^R01 in over MLLP -> FHIR -> ClinicHub, and an ORU^R01 copy of the
    # results the hub relays to an OLIS-style receiver. Off until a queue key and the ClinicHub secret are set.
    enabled: ${HUB_HL7_ENABLED:false}
    # 32 random bytes, base64 (openssl rand -base64 32). Encrypts queued messages at rest.
    queue-key: ${HUB_HL7_QUEUE_KEY:}
    zone: ${HUB_HL7_ZONE:America/Toronto}
    # MSH-3.MSH-4 of the senders to accept, e.g. EXTLAB.LAB1. Empty = any sender.
    allowed-senders: ${HUB_HL7_ALLOWED_SENDERS:}
    mllp:
      port: ${HUB_HL7_MLLP_PORT:2575}
      bind-address: ${HUB_HL7_MLLP_BIND:0.0.0.0}
    clinichub:
      token-url: ${HUB_CLINICHUB_TOKEN_URL:${HUB_AUTH_ISSUER:http://localhost:5301/}connect/token}
      fhir-url: ${HUB_CLINICHUB_FHIR_URL:${HUB_ROUTE_CLINICHUB_UPSTREAM:http://localhost:5300}/fhir}
      client-id: integrationhub
      client-secret: ${HUB_CLINICHUB_CLIENT_SECRET:}
      scope: results
    outbound:
      enabled: ${HUB_HL7_OUTBOUND_ENABLED:false}
      host: ${HUB_HL7_OUTBOUND_HOST:}
      port: ${HUB_HL7_OUTBOUND_PORT:2576}
  admin:
    # Reading the message log and metrics: a ClinicHub token with this permission.
    permission: integrationhub:messages.view
    audience: ''
    local-access: false
  auth:
    # ClinicHub (OpenIddict). Keys are read from {issuer}.well-known/jwks unless jwks-uri is set.
    issuer: ${HUB_AUTH_ISSUER:http://localhost:5301/}
    jwks-uri: ${HUB_AUTH_JWKS_URI:}
  max-body-bytes: 33554432
  routes:
    # Results from LabFlow and ClinicReport to ClinicHub: /route/clinichub/fhir
    clinichub:
      upstream: ${HUB_ROUTE_CLINICHUB_UPSTREAM:http://localhost:5300}
      timeout: 30s
      connect-timeout: 5s
      required-scopes: [results]
    # Orders and cancels from ClinicHub: /route/labflow/fhir
    labflow:
      upstream: ${HUB_ROUTE_LABFLOW_UPSTREAM:http://localhost:5180}
      allowed-audiences: [labflow]
      required-scopes: [orders]
      allowed-methods: [POST, PUT]
    clinicreport:
      upstream: ${HUB_ROUTE_CLINICREPORT_UPSTREAM:http://localhost:5290}
      allowed-audiences: [clinicreport]
      required-scopes: [orders]
      allowed-methods: [POST, PUT]
    # Electronic prescriptions and patient merges from ClinicHub: /route/pharmaflow/fhir
    pharmaflow:
      upstream: ${HUB_ROUTE_PHARMAFLOW_UPSTREAM:http://localhost:5500}
      allowed-audiences: [pharmaflow]
      required-scopes: [prescriptions]
      allowed-methods: [POST]
    # Financial documents from every application: /route/finance/api/integration/documents
    finance:
      upstream: ${HUB_ROUTE_FINANCE_UPSTREAM:http://localhost:5400}
      allowed-audiences: [finance]
      required-scopes: [finance]
      allowed-paths: [/api/integration/documents]
      body-format: finance-documents
      forward-headers: [X-Finance-Key]
      # Development only: set to X-Finance-Key to let a call with that header and no token through
      # (FinancePowerApp then checks the key). Empty = a token is always required.
      api-key-header: ${HUB_ROUTE_FINANCE_API_KEY_HEADER:}
